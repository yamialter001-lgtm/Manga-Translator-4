name: Apply update zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and apply
        run: |
          set -e
          Z=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$Z" ]; then echo "ไม่พบไฟล์ .zip ที่รากของ repo"; exit 1; fi
          rm -rf /tmp/upd && mkdir /tmp/upd && unzip -q "$Z" -d /tmp/upd
          SRC=/tmp/upd
          if [ "$(ls -A /tmp/upd | wc -l)" = "1" ] && [ -d "/tmp/upd/$(ls /tmp/upd)" ]; then SRC="/tmp/upd/$(ls /tmp/upd)"; fi
          rm -rf "$SRC/.github" "$SRC/.git"
          cp -a "$SRC"/. ./
          rm -f "$Z"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply update from zip" || echo "no changes"
          git push origin HEAD
