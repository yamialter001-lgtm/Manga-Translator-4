name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "ชื่อเวอร์ชันของ Release เช่น v1.0.0 (เว้นว่าง = ตั้งให้อัตโนมัติ)"
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'mangatranslator' }}
      KS_ALIAS: ${{ secrets.KEY_ALIAS || 'manga' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then T="${{ github.ref_name }}";
          elif [ -n "${{ github.event.inputs.tag }}" ]; then T="${{ github.event.inputs.tag }}";
          else T="v1.0.${{ github.run_number }}"; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "name=${T#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch FiraGO font (optional)
        run: bash scripts/fetch-fonts.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          bash android-overrides/apply.sh "${{ github.run_number }}" "${{ steps.ver.outputs.name }}"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: bash scripts/sign-apk.sh "${{ steps.ver.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-apk
          path: dist-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Manga Translator ${{ steps.ver.outputs.tag }}
          files: dist-apk/*.apk
          generate_release_notes: true
